<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellular Automata Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="toolbar">
        <div class="brand">
            <h1>CA Lab</h1>
            <span id="fps-counter">0 FPS</span>
        </div>
        <div class="controls">
            <button id="btn-play" class="btn primary">Start</button>
            <button id="btn-step" class="btn">Step</button>
            <button id="btn-clear" class="btn">Clear</button>
            <select id="preset-select" class="select">
                <option value="">Load Preset...</option>
                <option value="glider">Glider</option>
                <option value="gun">Gosper Glider Gun</option>
                <option value="pulsar">Pulsar</option>
                <option value="lwss">Lightweight Spaceship</option>
            </select>
            <div class="divider"></div>
            <label for="rule-input">Rule:</label>
            <input type="text" id="rule-input" value="B3/S23" class="input-rule">
            <button id="btn-apply-rule" class="btn">Apply</button>
            <div class="divider"></div>
            <label for="speed-range">Speed:</label>
            <input type="range" id="speed-range" min="1" max="60" value="30">
        </div>
    </header>
    
    <main class="viewport-container">
        <canvas id="sim-canvas"></canvas>
        <div class="status-bar">
            <span id="cursor-pos">X: 0, Y: 0</span>
            <span id="gen-counter">Generation: 0</span>
            <span id="population-counter">Population: 0</span>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
